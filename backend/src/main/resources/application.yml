spring:
  application:
    name: orderflow
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/orderflow}
    username: ${DB_USERNAME:orderflow}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 15000
        request.timeout.ms: 5000
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        isolation.level: read_committed
    listener:
      ack-mode: record
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  # Atrás do Nginx: usa X-Forwarded-Host (com porta) e X-Forwarded-Proto para reconhecer a origem real.
  # Sem isso, um POST do navegador (que envia Origin) pareceria cross-origin e seria barrado pelo CORS.
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    kafka:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

orderflow:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  kafka:
    partitions: 3
  outbox:
    poll-interval-ms: 500
    batch-size: 50
  payments:
    simulated-transient-failures: 2
    retry:
      interval-ms: ${PAYMENT_RETRY_INTERVAL_MS:1000}
      max-retries: ${PAYMENT_MAX_RETRIES:3}
  demo:
    enabled: ${DEMO_DATA_ENABLED:false}
    admin-password: ${DEMO_ADMIN_PASSWORD:}
    operator-password: ${DEMO_OPERATOR_PASSWORD:}

logging:
  level:
    org.apache.kafka: WARN
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: ERROR

---
spring:
  config:
    activate:
      on-profile: docker
logging:
  structured:
    format:
      console: ecs
